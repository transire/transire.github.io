extends: default

rules:
  # Allow longer lines for GitHub Actions
  line-length:
    max: 120
    level: warning

  # Don't require document start markers
  document-start:
    present: false

  # Allow truthy values like 'on' and 'off' in GitHub Actions
  truthy:
    allowed-values: ['true', 'false', 'on', 'off', 'yes', 'no']
    check-keys: false

# Ignore specific files
ignore: |
  .venv/
  site/
  node_modules/
