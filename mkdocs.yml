# Transire Documentation Site Configuration
site_name: Transire
site_url: https://transire.github.io
site_description: Cloud-agnostic Go framework for building production APIs. Write standard Go with Chi routing that runs locally and on AWS Lambda.
site_author: Transire Team
repo_url: https://github.com/transire/transire
repo_name: transire/transire
edit_uri: edit/main/docs/

# Theme
theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant      # Fast loading
    - navigation.tracking     # URL updates on scroll
    - navigation.tabs         # Top-level tabs
    - navigation.sections     # Collapsible sections
    - navigation.indexes      # Section index pages
    - toc.follow              # TOC follows scroll
    - search.suggest          # Search suggestions
    - search.highlight        # Highlight search terms
    - content.code.copy       # Copy button on code blocks
    - content.action.edit     # Edit page on GitHub
  icon:
    repo: fontawesome/brands/github

# Navigation
nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Your First API: getting-started/your-first-api.md
  - Core Concepts:
      - Application & Runtime: core-concepts/application-runtime.md
      - HTTP Handlers: core-concepts/http-handlers.md
      - Queue Handlers: core-concepts/queue-handlers.md
      - Schedule Handlers: core-concepts/schedule-handlers.md
      - Configuration System: core-concepts/configuration.md
  - Guides:
      - Local Development: guides/local-development.md
      - Testing: guides/testing.md
      - Deploying to AWS: guides/deploying-to-aws.md
      - Queue Processing: guides/queue-processing.md
      - Scheduled Tasks: guides/scheduled-tasks.md
      - Multi-Function Architecture: guides/multi-function-architecture.md
      - Custom CDK Extensions: guides/custom-cdk.md
  - Configuration:
      - transire.yaml Reference: configuration/transire-yaml.md
      - Lambda Settings: configuration/lambda.md
      - Queue Configuration: configuration/queues.md
      - Schedule Configuration: configuration/schedules.md
      - Environment Variables: configuration/environment.md
      - VPC & Existing Resources: configuration/vpc-existing.md
  - CLI Reference:
      - Overview: cli-reference/index.md
      - transire init: cli-reference/transire-init.md
      - transire run: cli-reference/transire-run.md
      - transire dev: cli-reference/transire-dev.md
      - transire build: cli-reference/transire-build.md
      - transire deploy: cli-reference/transire-deploy.md
  - API Reference:
      - Overview: api-reference/index.md
      - Package transire: api-reference/transire.md
      - Handlers: api-reference/handlers.md
      - Messages & Events: api-reference/messages.md
      - Configuration Types: api-reference/config.md
  - Examples:
      - Simple API: examples/simple-api.md
      - Todo App: examples/todo-app.md
      - Full Application: examples/full-app.md
  - FAQ: faq.md
  - Contributing: contributing.md

# Plugins
plugins:
  - search:
      lang: en
      separator: '[\s\-\.]+'

# Markdown extensions
markdown_extensions:
  - admonition              # Note/warning/tip blocks
  - pymdownx.details        # Collapsible blocks
  - pymdownx.superfences:   # Code blocks with syntax highlighting
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite   # Inline code highlighting
  - pymdownx.snippets       # Include external files
  - pymdownx.tabbed:        # Tabbed content
      alternate_style: true
  - tables                  # Tables
  - toc:                    # Table of contents
      permalink: true
      toc_depth: 3
  - attr_list               # Add HTML attrs to elements
  - def_list                # Definition lists
  - meta                    # YAML front matter

# Extra
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/transire/transire
      name: Transire on GitHub

extra_css:
  - stylesheets/extra.css

