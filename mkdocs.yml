site_name: Transire Documentation
site_url: https://docs.transire.dev
site_description: Cloud-native Go framework. Same code, anywhere.
repo_url: https://github.com/transire/transire
repo_name: transire/transire
edit_uri: edit/main/repos/transire-docs/docs/

theme:
  name: material
  # custom_dir: overrides  # Custom templates (not yet implemented)
  logo: assets/logo.png
  favicon: assets/favicon.ico

  features:
    - navigation.instant      # Fast page loads (SPA-like)
    - navigation.tracking     # URL updates on scroll
    - navigation.tabs         # Top-level tabs
    - navigation.sections     # Collapsible sections
    - navigation.indexes      # Section index pages
    - navigation.top          # Back to top button
    - navigation.footer       # Previous/next navigation
    - search.suggest          # Search suggestions
    - search.highlight        # Highlight search terms
    - search.share            # Share search results
    - content.code.copy       # Copy button on code blocks
    - content.code.annotate   # Code annotations
    - content.tabs.link       # Linked content tabs
    - content.action.edit     # Edit button
    - content.action.view     # View source button

  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  font:
    text: Inter
    code: Fira Code

plugins:
  - search:
      lang: en
      separator: '[\s\-\.]+'
  - meta  # YAML frontmatter support
  - tags  # Tag support
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  analytics:
    provider: google
    property: G-XXXXXXXXXX  # Add after setup
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/transire/transire
      name: Transire on GitHub
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/transire
      name: Transire on Twitter
  version:
    provider: mike  # For versioning (future)

